# Horizon Atmospheric Shaders
# Compatible with Minecraft Java Edition 26.2, Iris + Sodium

sliders=COLOR_STRENGTH SATURATION SHADOW_STRENGTH AMBIENT_STRENGTH BLOOM_QUALITY
screen=<empty> <profile> <empty> [LIGHTING] [COLOR] [EFFECTS]

screen.LIGHTING=SHADOW_STRENGTH AMBIENT_STRENGTH
screen.COLOR=COLOR_STRENGTH SATURATION TONEMAP
screen.EFFECTS=BLOOM BLOOM_QUALITY VIGNETTE CHROMATIC_ABERRATION

profile.LOW=!BLOOM !VIGNETTE BLOOM_QUALITY:0 COLOR_STRENGTH:0.45 SATURATION:1.0 SHADOW_STRENGTH:0.7 AMBIENT_STRENGTH:0.22 TONEMAP:0
profile.MEDIUM=BLOOM VIGNETTE BLOOM_QUALITY:1 COLOR_STRENGTH:0.65 SATURATION:1.12 SHADOW_STRENGTH:0.85 AMBIENT_STRENGTH:0.18 TONEMAP:1
profile.HIGH=BLOOM VIGNETTE CHROMATIC_ABERRATION BLOOM_QUALITY:2 COLOR_STRENGTH:0.8 SATURATION:1.2 SHADOW_STRENGTH:0.95 AMBIENT_STRENGTH:0.14 TONEMAP:2

blend.gbuffers_terrain=off 1 off 2 off
blend.gbuffers_block=off 1 off 2 off
blend.gbuffers_entities=off 1 off 2 off
blend.gbuffers_hand=off 1 off 2 off
blend.gbuffers_water=dstalpha 0 srcalpha 1 off 2 off
blend.gbuffers_hand_water=dstalpha 0 srcalpha 1 off 2 off
blend.gbuffers_textured=off 1 off 2 off
blend.gbuffers_basic=off 1 off 2 off
blend.gbuffers_skybasic=off 1 off 2 off
blend.gbuffers_skytextured=off 1 off 2 off
blend.gbuffers_clouds=off 1 off 2 off
blend.gbuffers_weather=off 1 off 2 off
blend.gbuffers_textured_lit=off 1 off 2 off
blend.gbuffers_beaconbeam=off 1 off 2 off
blend.gbuffers_armor_glint=off 1 off 2 off
blend.gbuffers_spidereyes=off 1 off 2 off

size.buffer.colortex3=0.5 0.5
size.buffer.colortex4=0.5 0.5

program.composite1.enabled=BLOOM
program.composite2.enabled=BLOOM
program.composite3.enabled=BLOOM

separateAo=true
underwaterOverlay=false
vignette=false
